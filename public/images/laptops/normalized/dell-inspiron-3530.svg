<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <defs>
    <!-- Screen Gradient -->
    <linearGradient id="screen_dell_inspiron_3530" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0EA5A4" />
    </linearGradient>
    <!-- Body Base Gradient -->
    <linearGradient id="body_dell_inspiron_3530" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <!-- Hinge / Depth Shadow -->
    <linearGradient id="shadow_dell_inspiron_3530" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.0" />
    </linearGradient>
    <!-- Keyboard Accent Lighting -->
    <linearGradient id="kb_glow_dell_inspiron_3530" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0EA5A4" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#0EA5A4" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0EA5A4" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Ground Soft Drop Shadow -->
  <ellipse cx="200" cy="272" rx="145" ry="14" fill="#0F172A" fill-opacity="0.1" filter="blur(4px)" />
  <ellipse cx="200" cy="270" rx="125" ry="8" fill="#0F172A" fill-opacity="0.14" />

  <!-- ── 1. LAPTOP DISPLAY / LID (Angled Open Perspective) ── -->
  <g id="screen-assembly">
    <!-- Screen Outer Shell Bezel -->
    <rect x="70" y="32" width="260" height="170" rx="10" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.5" />
    
    <!-- Screen Inner Bezel -->
    <rect x="74" y="36" width="252" height="160" rx="6" fill="#1E293B" />

    <!-- Webcam Notch / Dot -->
    <circle cx="200" cy="42" r="2" fill="#38BDF8" fill-opacity="0.8" />
    <circle cx="200" cy="42" r="1" fill="#FFFFFF" />

    <!-- Active Display Screen Glass -->
    <rect x="80" y="46" width="240" height="142" rx="3" fill="url(#screen_dell_inspiron_3530)" />

    <!-- Wallpaper Abstract Graphics -->
    <path d="M80 140 Q 140 80, 200 120 T 320 70 L 320 188 L 80 188 Z" fill="#FFFFFF" fill-opacity="0.08" />
    <path d="M80 160 Q 160 110, 240 140 T 320 110 L 320 188 L 80 188 Z" fill="#0EA5A4" fill-opacity="0.2" />
    <circle cx="270" cy="85" r="30" fill="#FFFFFF" fill-opacity="0.12" />

    <!-- Brand / Series Logo inside Screen -->
    <rect x="160" y="100" width="80" height="24" rx="12" fill="#000000" fill-opacity="0.35" backdrop-filter="blur(4px)" />
    <text x="200" y="116" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
      DELL
    </text>

    <!-- Glass Glare Reflection -->
    <polygon points="80,46 160,46 80,188" fill="#FFFFFF" fill-opacity="0.06" />
  </g>

  <!-- ── 2. LAPTOP BASE / KEYBOARD DECK (Standard 4:3 Proportion) ── -->
  <g id="base-assembly">
    <!-- Hinge Bar -->
    <rect x="130" y="196" width="140" height="8" rx="3" fill="#1E293B" />

    <!-- Main Chassis / Palmrest -->
    <polygon points="40,256 360,256 332,198 68,198" fill="url(#body_dell_inspiron_3530)" stroke="#94A3B8" stroke-width="1.5" />
    
    <!-- Base Front Edge Lip -->
    <polygon points="40,256 360,256 356,264 44,264" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1" />
    <!-- Front Opening Notch -->
    <rect x="180" y="256" width="40" height="3" rx="1" fill="#64748B" />

    <!-- Keyboard Well Recess -->
    <polygon points="86,236 314,236 304,204 96,204" fill="#334155" stroke="#E2E8F0" stroke-width="1" />
    <!-- Keyboard Key Grid -->
    <line x1="94" y1="212" x2="306" y2="212" stroke="#475569" stroke-width="1" stroke-dasharray="8 3" />
    <line x1="91" y1="220" x2="309" y2="220" stroke="#475569" stroke-width="1" stroke-dasharray="9 3" />
    <line x1="88" y1="228" x2="312" y2="228" stroke="#475569" stroke-width="1" stroke-dasharray="10 3" />
    <!-- Spacebar -->
    <rect x="160" y="230" width="80" height="4" rx="1.5" fill="#64748B" />

    <!-- Keyboard Accent Glow for Gaming Laptops -->
    

    <!-- Precision Touchpad -->
    <polygon points="166,252 234,252 230,240 170,240" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1" />
  </g>
</svg>